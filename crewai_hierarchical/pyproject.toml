[project]
name = "crewai_hierarchical"
version = "0.1.0"
description = "crewai_hierarchical using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.7.2",
    "langfuse>=3.11.2",
]

[project.scripts]
crewai_hierarchical = "crewai_hierarchical.main:run"
run_crew = "crewai_hierarchical.main:run"
train = "crewai_hierarchical.main:train"
replay = "crewai_hierarchical.main:replay"
test = "crewai_hierarchical.main:test"
run_with_trigger = "crewai_hierarchical.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
